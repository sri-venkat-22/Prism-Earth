# Prism Earth — production topology (SRS §33.1, §33.2).
#
# Users → Nginx (reverse proxy, TLS-ready) → frontend (Next.js) + backend
# (FastAPI, multi-worker) → Redis + PostGIS. No source bind mounts; images are
# built (or pulled from GHCR) and run with restart policies and healthchecks.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Add the monitoring stack with the overlay:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prism_earth}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prism} -d ${POSTGRES_DB:-prism_earth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply DB migrations before the API starts serving.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      PRISM_APP_ENV: production
      PRISM_DEBUG: "false"
      PRISM_LOG_JSON: "true"
      PRISM_POSTGRES_HOST: db
      PRISM_POSTGRES_PORT: "5432"
      PRISM_POSTGRES_USER: ${POSTGRES_USER:-prism}
      PRISM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PRISM_POSTGRES_DB: ${POSTGRES_DB:-prism_earth}
      PRISM_REDIS_URL: redis://redis:6379/0
      PRISM_CONFIG_DIR: /configs
      PRISM_AUTH_USE_REDIS: "true"
      PRISM_METRICS_ENABLED: "true"
      PRISM_RATE_LIMIT_ENABLED: "true"
      # Secure-by-default production posture (SRS §13.20, §29.3). Auth is ON
      # unless explicitly overridden, and the app refuses to start with it off in
      # production. A bootstrap admin token is REQUIRED to issue tokens.
      PRISM_AUTH_ENABLED: ${PRISM_AUTH_ENABLED:-true}
      PRISM_AUTH_ADMIN_TOKEN: ${PRISM_AUTH_ADMIN_TOKEN:?set PRISM_AUTH_ADMIN_TOKEN in .env to bootstrap token issuance}
      # CORS: default to same-origin only ("[]"). The frontend is served through
      # Nginx on the same origin, so no cross-origin entry is needed; set a JSON
      # allow-list here only for a separate browser app. Wildcard is rejected in
      # production.
      PRISM_CORS_ORIGINS: ${PRISM_CORS_ORIGINS:-[]}
      # The app sits behind Nginx, which sets a trustworthy X-Real-IP, so honor
      # the forwarded client IP for rate-limit keying (spoof-safe, SRS §13.19).
      PRISM_TRUST_PROXY_HEADERS: "true"
      # Opt-in tracing — supply via .env in production (SRS §27.3).
      PRISM_OTEL_ENABLED: ${PRISM_OTEL_ENABLED:-false}
      PRISM_OTEL_EXPORTER_ENDPOINT: ${PRISM_OTEL_EXPORTER_ENDPOINT:-}
    volumes:
      - ./configs:/configs:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *backend_env
      # GEE credentials are mounted as a Docker secret at /run/secrets/gee_key —
      # never baked into the image or committed (SRS §19.3, §29.2). Only the
      # backend needs them; the migrate job does not. Rotate the key before
      # exposure and replace ./secrets/prism-earth-gee.json from your key store.
      PRISM_EARTH_ENGINE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      PRISM_EARTH_ENGINE_PROJECT: ${GEE_PROJECT:-}
      PRISM_EARTH_ENGINE_KEY_FILE: /run/secrets/gee_key
    secrets:
      - gee_key
    volumes:
      - ./configs:/configs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined into the bundle at build time (see the frontend
      # Dockerfile) — passing it as runtime `environment:` would be a no-op.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_API_DOCS_URL: ${NEXT_PUBLIC_API_DOCS_URL:-/docs}
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certs (SRS §29.2). Drop fullchain.pem + privkey.pem here (from your
      # CA / Let's Encrypt) before exposing the service; Nginx will not start
      # without them, and :80 redirects to :443.
      - ./deployment/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:

# GEE service-account key mounted read-only into the backend (SRS §19.3, §29.2).
# The file stays in the gitignored ./secrets/ directory and is never committed
# or baked into an image.
secrets:
  gee_key:
    file: ./secrets/prism-earth-gee.json
