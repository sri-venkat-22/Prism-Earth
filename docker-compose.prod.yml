# Terra — production topology (SRS §33.1, §33.2).
#
# Users → Nginx (reverse proxy, TLS-ready) → frontend (Next.js) + backend
# (FastAPI, multi-worker) → Redis + PostGIS. No source bind mounts; images are
# built (or pulled from GHCR) and run with restart policies and healthchecks.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Add the monitoring stack with the overlay:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# NOTE: Postgres and Redis are managed cloud services (Neon / Upstash) via
# TERRA_POSTGRES_* / TERRA_REDIS_URL. What runs here is a SINGLE-NODE app tier:
# the nginx edge and a single backend are the remaining single points of
# failure. For higher availability run >=2 backend replicas behind a load
# balancer; see "Single points of failure & HA expectations" in
# docs/deployment.md.
services:
  # Postgres (Neon) and Redis (Upstash) are managed cloud services — set
  # TERRA_POSTGRES_* and TERRA_REDIS_URL in .env to point at them. No bundled
  # db/redis containers in this topology.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TERRA_APP_ENV: production
      TERRA_DEBUG: "false"
      TERRA_LOG_JSON: "true"
      TERRA_POSTGRES_HOST: ${TERRA_POSTGRES_HOST:?set TERRA_POSTGRES_HOST in .env (Neon host)}
      TERRA_POSTGRES_PORT: ${TERRA_POSTGRES_PORT:-5432}
      TERRA_POSTGRES_USER: ${TERRA_POSTGRES_USER:?set TERRA_POSTGRES_USER in .env}
      TERRA_POSTGRES_PASSWORD: ${TERRA_POSTGRES_PASSWORD:?set TERRA_POSTGRES_PASSWORD in .env}
      TERRA_POSTGRES_DB: ${TERRA_POSTGRES_DB:?set TERRA_POSTGRES_DB in .env}
      # Managed Postgres requires TLS; "require" is the safe default here.
      TERRA_POSTGRES_SSLMODE: ${TERRA_POSTGRES_SSLMODE:-require}
      TERRA_REDIS_URL: ${TERRA_REDIS_URL:?set TERRA_REDIS_URL in .env (Upstash rediss:// URL)}
      TERRA_CONFIG_DIR: /configs
      # Uvicorn worker processes (SRS §33). Tune to the host's CPU/RAM; each
      # worker loads the full app, so keep it modest on small instances.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      TERRA_AUTH_USE_REDIS: "true"
      TERRA_METRICS_ENABLED: "true"
      TERRA_RATE_LIMIT_ENABLED: "true"
      # Secure-by-default production posture (SRS §13.20, §29.3). Auth is ON
      # unless explicitly overridden, and the app refuses to start with it off in
      # production. A bootstrap admin token is REQUIRED to issue tokens.
      TERRA_AUTH_ENABLED: ${TERRA_AUTH_ENABLED:-true}
      TERRA_AUTH_ADMIN_TOKEN: ${TERRA_AUTH_ADMIN_TOKEN:?set TERRA_AUTH_ADMIN_TOKEN in .env to bootstrap token issuance}
      # CORS: default to same-origin only ("[]"). The frontend is served through
      # Nginx on the same origin, so no cross-origin entry is needed; set a JSON
      # allow-list here only for a separate browser app. Wildcard is rejected in
      # production.
      TERRA_CORS_ORIGINS: ${TERRA_CORS_ORIGINS:-[]}
      # The app sits behind Nginx, which sets a trustworthy X-Real-IP, so honor
      # the forwarded client IP for rate-limit keying (spoof-safe, SRS §13.19).
      TERRA_TRUST_PROXY_HEADERS: "true"
      # Public origin of this deployment (https://your-domain). Used as the
      # OAuth issuer / resource identifier in the /.well-known discovery
      # documents and to build the Google login callback URL — localhost
      # defaults would break MCP OAuth and login in production.
      TERRA_AUTH_ISSUER_URL: ${TERRA_AUTH_ISSUER_URL:?set TERRA_AUTH_ISSUER_URL in .env to the public https origin}
      # Where the browser lands after Google login. Same-origin topology, so it
      # defaults to the public origin above.
      TERRA_FRONTEND_BASE_URL: ${TERRA_FRONTEND_BASE_URL:-${TERRA_AUTH_ISSUER_URL}}
      # AI pipeline (/ask): LiteLLM route + provider key. Without a key /ask
      # returns an honest 503; set both to enable natural-language answers.
      TERRA_LLM_MODEL: ${TERRA_LLM_MODEL:-anthropic/claude-opus-4-8}
      TERRA_LLM_API_KEY: ${TERRA_LLM_API_KEY:-}
      # "Sign in with Google" (optional — button hidden when unset).
      TERRA_GOOGLE_OAUTH_CLIENT_ID: ${TERRA_GOOGLE_OAUTH_CLIENT_ID:-}
      TERRA_GOOGLE_OAUTH_CLIENT_SECRET: ${TERRA_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Opt-in tracing — supply via .env in production (SRS §27.3).
      TERRA_OTEL_ENABLED: ${TERRA_OTEL_ENABLED:-false}
      TERRA_OTEL_EXPORTER_ENDPOINT: ${TERRA_OTEL_EXPORTER_ENDPOINT:-}
      # GEE credentials are mounted as a Docker secret at /run/secrets/gee_key —
      # never baked into the image or committed (SRS §19.3, §29.2). Rotate the
      # key before exposure and replace ./secrets/terra-gee.json from your key
      # store.
      TERRA_EARTH_ENGINE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      TERRA_EARTH_ENGINE_PROJECT: ${GEE_PROJECT:-}
      TERRA_EARTH_ENGINE_KEY_FILE: /run/secrets/gee_key
    secrets:
      - gee_key
    volumes:
      - ./configs:/configs:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* is inlined into the bundle at build time (see the frontend
      # Dockerfile) — passing it as runtime `environment:` would be a no-op.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_API_DOCS_URL: ${NEXT_PUBLIC_API_DOCS_URL:-/docs}
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certs (SRS §29.2). Drop fullchain.pem + privkey.pem here (from your
      # CA / Let's Encrypt) before exposing the service; Nginx will not start
      # without them, and :80 redirects to :443.
      - ./deployment/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

# GEE service-account key mounted read-only into the backend (SRS §19.3, §29.2).
# The file stays in the gitignored ./secrets/ directory and is never committed
# or baked into an image.
secrets:
  gee_key:
    file: ./secrets/terra-gee.json
