# Prism Earth — production topology (SRS §33.1, §33.2).
#
# Users → Nginx (reverse proxy, TLS-ready) → frontend (Next.js) + backend
# (FastAPI, multi-worker) → Redis + PostGIS. No source bind mounts; images are
# built (or pulled from GHCR) and run with restart policies and healthchecks.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Add the monitoring stack with the overlay:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prism_earth}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prism} -d ${POSTGRES_DB:-prism_earth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply DB migrations before the API starts serving.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      PRISM_APP_ENV: production
      PRISM_DEBUG: "false"
      PRISM_LOG_JSON: "true"
      PRISM_POSTGRES_HOST: db
      PRISM_POSTGRES_PORT: "5432"
      PRISM_POSTGRES_USER: ${POSTGRES_USER:-prism}
      PRISM_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PRISM_POSTGRES_DB: ${POSTGRES_DB:-prism_earth}
      PRISM_REDIS_URL: redis://redis:6379/0
      PRISM_CONFIG_DIR: /configs
      PRISM_AUTH_USE_REDIS: "true"
      PRISM_METRICS_ENABLED: "true"
      PRISM_RATE_LIMIT_ENABLED: "true"
      # Opt-in auth + tracing — supply via .env in production (SRS §13.20, §27.3).
      PRISM_AUTH_ENABLED: ${PRISM_AUTH_ENABLED:-false}
      PRISM_AUTH_ADMIN_TOKEN: ${PRISM_AUTH_ADMIN_TOKEN:-}
      PRISM_OTEL_ENABLED: ${PRISM_OTEL_ENABLED:-false}
      PRISM_OTEL_EXPORTER_ENDPOINT: ${PRISM_OTEL_EXPORTER_ENDPOINT:-}
    volumes:
      - ./configs:/configs:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend_env
    volumes:
      - ./configs:/configs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_API_DOCS_URL: ${NEXT_PUBLIC_API_DOCS_URL:-/docs}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # enable with the TLS server block in nginx.conf
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./deployment/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
