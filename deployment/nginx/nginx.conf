# Prism Earth reverse proxy (SRS §33.1 production topology, §29.3).
#
# Terminates client traffic and routes it to the frontend (Next.js) and backend
# (FastAPI) services. Adds gzip, forwards the real client IP (so the backend
# gateway rate limiter keys correctly, SRS §13.19), and applies an edge rate
# limit as defense in depth. A TLS server block is included, commented, ready to
# enable once certificates are mounted (SRS §29.2).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/xml;

    # Edge rate limit (defense in depth alongside the app limiter, SRS §13.19).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream prism_backend {
        server backend:8000;
        keepalive 32;
    }
    upstream prism_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # Forward headers shared by all proxied locations.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    server {
        listen 80;
        server_name _;

        # --- Backend API + docs + metrics + OAuth discovery -------------- #
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://prism_backend;
        }
        location = /docs {
            proxy_pass http://prism_backend;
        }
        location = /redoc {
            proxy_pass http://prism_backend;
        }
        location = /openapi.json {
            proxy_pass http://prism_backend;
        }
        location /.well-known/ {
            proxy_pass http://prism_backend;
        }
        # Metrics stays internal — expose to the monitoring network only.
        location = /metrics {
            proxy_pass http://prism_backend;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # --- Frontend (Next.js) ------------------------------------------ #
        location / {
            proxy_pass http://prism_frontend;
        }
    }

    # --- HTTPS (SRS §29.2) — enable once certificates are mounted ---------- #
    # server {
    #     listen 443 ssl http2;
    #     server_name prism.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     # ... same location blocks as the :80 server above ...
    # }
}
