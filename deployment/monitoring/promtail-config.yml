# Promtail — ships container stdout/stderr to Loki (SRS §27.1).
# The backend emits JSON logs (PRISM_LOG_JSON=true) with the correlation id, so
# log lines correlate with traces and the X-Correlation-ID response header.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Parse the structured JSON logs so `level` and `event` become labels.
      - json:
          expressions:
            level: level
            event: event
            correlation_id: correlation_id
      - labels:
          level:
