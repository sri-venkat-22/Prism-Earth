# Loki single-binary config for the Terra log stack (SRS §27.1, §27.3).
# Filesystem storage — suitable for a single-node deployment; swap the object
# store for S3/GCS at scale.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
