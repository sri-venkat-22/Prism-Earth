# Grafana dashboard provisioning (SRS §27.3).
apiVersion: 1

providers:
  - name: Terra
    orgId: 1
    folder: Terra
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
