# Terra image publishing (SRS §31.1 "Docker build → deployment", §33.2).
#
# Builds and pushes the backend and frontend container images to the GitHub
# Container Registry (GHCR) on a version tag (v1.2.3) or manual dispatch. The CI
# gate (ci.yml) must be green on the commit before a release tag is cut, so only
# validated code is ever published (§30.4, §36.5).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Backend builds from the repo root so its Dockerfile can COPY both
          # backend/ and the top-level configs/ (baked in for volumeless PaaS).
          - name: backend
            context: .
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/terra-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
