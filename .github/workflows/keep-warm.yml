# Pings the Render free-tier backend so it never spins down from 15 min of
# idle (Render's free plan sleeps and takes ~50s to cold-boot on the next
# request). Costs nothing: scheduled Actions minutes are free on public repos.
#
# GitHub delays/drops scheduled cron on low-traffic repos (observed gaps of
# 60-200+ min despite the 10-min setting below), so pings often land on a
# server that's already back asleep and end up doing a real cold-boot wake.
# That wake regularly outlasted any single bounded curl (150s wasn't enough),
# so the step polls: the first request triggers the wake, later ones catch the
# booted instance, and only ~10 minutes of unreachability fails the run.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (poll through the cold boot)
        # ponytail: URL hardcoded (single deployment target); move to a repo
        # variable if a second environment ever needs its own keep-warm ping.
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 60 https://terra-backend-pgtq.onrender.com/api/v1/health; then
              echo " — healthy (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "backend still unreachable after ~10 minutes — treating as a real outage"
          exit 1
