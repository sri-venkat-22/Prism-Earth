[project]
name = "terra-backend"
version = "0.1.0"
description = "Terra backend — deterministic, citation-backed geospatial intelligence (SRS §9, §11)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "geoalchemy2>=0.15,<1.0",
    "shapely>=2.0,<3.0",
    "earthengine-api>=1.0,<2.0",
    "redis>=5.0,<6.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4",
    # AI pipeline (SRS §9, §14, §6.5): provider-agnostic LLM access for the
    # Planner and Synthesizer. Imported lazily, so the deterministic Fetch spine
    # never needs it; the configured model is chosen via TERRA_LLM_MODEL.
    "litellm>=1.55,<2.0",
    # MCP server (SRS §9, §34): the Model Context Protocol SDK. Imported lazily
    # (only when running `python -m app.mcp`), so the REST app and the gate never
    # require it. The MCP server is a thin client over the REST API (§34.2).
    "mcp>=1.2,<2.0",
    # Observability (SRS §27): Prometheus metrics at /metrics and opt-in
    # OpenTelemetry tracing (a no-op unless an OTLP endpoint is configured).
    "prometheus-client>=0.21,<1.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    # Load testing (SRS §30.3 Table 7). Used ad hoc against a running instance;
    # not part of the unit/integration gate.
    "locust>=2.32",
]

# This is a runnable application, not a distributable package — uv should manage
# the environment without trying to build/install the project itself.
[tool.uv]
package = false

# --------------------------------------------------------------------------- #
# Ruff (lint + import sorting)                                                 #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear, and (Phase 8,
# SRS §29/§35.6) flake8-bandit static security analysis.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts (S101), in-fixture secrets/tokens (S105-107),
# and /tmp fixture paths (S108); none of that ships to production.
"app/tests/**" = ["S101", "S105", "S106", "S107", "S108"]

# --------------------------------------------------------------------------- #
# Black (formatting)                                                           #
# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

# --------------------------------------------------------------------------- #
# mypy (type checking)                                                         #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["migrations/", "app/tests/"]

# --------------------------------------------------------------------------- #
# pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
# Coverage is opt-in via ``--cov`` (CI passes it) so local runs stay fast.
addopts = "-q"

# --------------------------------------------------------------------------- #
# Coverage.py (SRS §30.5, §35.6) — gate at 85% for the backend                 #
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/tests/*",
    # The `python -m app.mcp` process entrypoint is exercised as a subprocess,
    # not in-process; it carries no logic worth unit-covering.
    "app/mcp/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
